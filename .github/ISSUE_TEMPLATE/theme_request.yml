name: Theme request
description: Point us to a theme that should be in the catalog
labels: [theme request]
body:
  - type: input
    id: name
    attributes:
      label: Theme name
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
  - type: input
    id: source
    attributes:
      label: Where to find it
      description: Download link, archive or Wayback Machine URL.
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Made for
      options:
        - EppieDesktop
        - Kaleidoscope 1.x
        - Kaleidoscope 2.x
        - Trois
        - Other
